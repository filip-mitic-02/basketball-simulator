<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta name="google" content="notranslate">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>82-0 Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Direction: arena scoreboard on a dark hardwood-night palette. Amber LED numerals, orange accent, team-colored crests.
   Layout: one column of panels; draft is a two-column board (spin + cards | position slots). */
:root{
  --ink:#0a0d12; --ink2:#0e131b; --panel:#131822; --panel2:#1a2130; --panel3:#222b3c; --line:#27303f; --line2:#34405a;
  --text:#e8ecf3; --mute:#8b97ab; --dim:#5d687c; --amber:#ffb627; --hot:#ff6a2b; --good:#36d17a; --bad:#ff5468; --blue:#5aa8ff;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0;
  background:
   radial-gradient(1200px 500px at 85% -10%,rgba(255,106,43,.10),transparent 60%),
   radial-gradient(900px 500px at -5% 20%,rgba(90,168,255,.07),transparent 60%)}
#top,#app{position:relative;z-index:1}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
a{color:var(--amber)}
#top{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line);background:rgba(15,20,29,.92);backdrop-filter:blur(6px);position:sticky;top:0;z-index:30}
.logo{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:.05em;color:var(--amber);cursor:pointer;display:flex;align-items:center;gap:10px}
.logo span{color:var(--text)}
.logo svg{width:26px;height:26px}
#top .sp{flex:1}
.acct{font-size:13px;color:var(--mute)}
.acct b{color:var(--text);font-weight:600}
#app{max-width:1280px;margin:0 auto;padding:22px 16px 70px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:600;transition:border-color .12s,background .12s,transform .06s}
.btn:hover{border-color:var(--mute);background:var(--panel3)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.chip:focus-visible,.pcard:focus-visible,.mode:focus-visible,.pl:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn.pri{background:var(--hot);border-color:var(--hot);color:#1a0b04;font-family:var(--display);font-size:20px;letter-spacing:.06em;text-transform:uppercase;padding:9px 26px;font-weight:700}
.btn.pri:hover{background:#ff8450;border-color:#ff8450}
.btn.amb{background:var(--amber);border-color:var(--amber);color:#1a1200}
.btn.amb:hover{background:#ffc652}
.btn.ghost{background:transparent;border-color:var(--amber);color:var(--amber);font-family:var(--display);font-size:20px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:9px 22px}
.btn.ghost:hover{background:rgba(255,182,39,.12)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn[disabled]{opacity:.35;cursor:not-allowed;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media(max-width:980px){.grid2{grid-template-columns:1fr}}
.panel{background:linear-gradient(180deg,var(--panel),#10151e);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:14px;color:var(--mute);margin:0 0 12px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.muted{color:var(--mute)}
.note{font-size:13px;color:var(--mute)}
.warn{color:var(--amber)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--panel3);border:1px solid var(--line2);color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line2);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px}
.chip:hover{border-color:var(--mute)}
.chip.on{background:var(--amber);border-color:var(--amber);color:#1a1200}
.chip[disabled]{opacity:.4;cursor:not-allowed}

/* ---------- menu ---------- */
.hero{padding:26px 0 24px;display:grid;grid-template-columns:1.25fr 1fr;gap:30px;align-items:center}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(46px,7.2vw,88px);line-height:.9;font-weight:800}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p{max-width:54ch;color:var(--mute);font-size:17px;margin:16px 0 0}
.led{font-family:var(--display);font-weight:700;color:var(--amber);letter-spacing:.06em;text-shadow:0 0 16px rgba(255,182,39,.32)}
.board{background:#06080b;border:2px solid var(--line2);border-radius:12px;padding:18px 24px;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.board .big{font-size:84px;line-height:1}
.setup{display:grid;gap:26px;padding:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.seg{display:flex;width:100%;background:var(--ink2);border:1px solid var(--line2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;background:transparent;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--amber);color:#1a1200}
@media(max-width:700px){.seg button{flex:1 1 22%}}
.range{position:relative;height:54px;margin:6px 8px 0}
.range .track{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:var(--panel3)}
.range .fill{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--hot),var(--amber));border-radius:3px}
.range input{position:absolute;left:-8px;width:calc(100% + 16px);top:9px;height:28px;margin:0;background:transparent;pointer-events:none;-webkit-appearance:none;appearance:none}
.range input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:28px;border-radius:5px;background:var(--text);border:2px solid var(--amber);cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.range input::-moz-range-thumb{pointer-events:auto;width:14px;height:24px;border-radius:5px;background:var(--text);border:2px solid var(--amber);cursor:grab}
.range input::-webkit-slider-runnable-track{background:transparent}
.range input::-moz-range-track{background:transparent}
.ticks{position:absolute;left:0;right:0;top:36px;height:16px;font-size:11px;color:var(--dim);font-family:var(--display);letter-spacing:.06em}
.ticks span{position:absolute;transform:translateX(-50%)}
.yr{display:flex;align-items:baseline;gap:10px}
.yr .led{font-size:46px;line-height:1}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.modes{grid-template-columns:1fr}}
.mode{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:16px 18px;cursor:pointer;text-align:left;display:grid;grid-template-columns:54px 1fr;gap:14px;align-items:center;position:relative;transition:border-color .12s}
.mode:hover{border-color:var(--mute)}
.mode.on{border-color:var(--amber);background:linear-gradient(135deg,#2a2412,var(--panel2) 65%)}
.mode.on::after{content:"Selected";position:absolute;top:10px;right:12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--amber)}
.mode svg{width:54px;height:54px}
.mode h3{font-size:26px;color:var(--text)}
.mode p{margin:2px 0 0;color:var(--mute);font-size:13.5px}
table{border-collapse:collapse;width:100%}
th{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:13px;color:var(--mute);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #1d2535;white-space:nowrap}
td.r,th.r{text-align:right}
.tw{overflow-x:auto}
tr.me td{background:rgba(255,182,39,.08)}

/* ---------- crest and avatar ---------- */
.crest{display:inline-block;vertical-align:middle;flex:none}
.avatar{flex:none}

/* ---------- draft ---------- */
.stage{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:stretch;margin-bottom:16px}
@media(max-width:700px){.stage{grid-template-columns:1fr}}
.reelbox{background:#06080b;border:2px solid var(--line2);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:18px;min-height:104px;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.reelbox .t{min-width:0}
.reelbox small{display:block;color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.reelbox .v{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.02;color:var(--text);text-transform:uppercase}
.reelbox .y{font-size:58px;line-height:1;margin-left:auto}
.reelbox.spin .v,.reelbox.spin .y{animation:flick .09s infinite}
@keyframes flick{50%{opacity:.5}}
@media(prefers-reduced-motion:reduce){.reelbox.spin .v,.reelbox.spin .y{animation:none}}
.actions{display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:220px}
.actions .btn{width:100%;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{--h:210;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:0;cursor:pointer;text-align:left;display:block;width:100%;overflow:hidden;position:relative;transition:border-color .12s,transform .1s}
.pcard:hover{border-color:var(--mute);transform:translateY(-2px)}
.pcard.sel{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber);transform:none}
.pcard.dis{opacity:.4;cursor:not-allowed;transform:none}
.pcard .hd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(90deg,hsla(var(--h),55%,32%,.9),hsla(var(--h),45%,18%,.4));border-bottom:1px solid var(--line2);font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.pcard .hd .ovr{margin-left:auto}
.pcard .bd{padding:11px 12px 12px;display:grid;gap:8px}
.pcard .who{display:flex;gap:10px;align-items:center}
.pcard .nm{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.02;text-transform:uppercase}
.pos{display:inline-flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.pos b{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.06em;padding:0 8px;border-radius:4px;background:var(--amber);color:#1a1200;line-height:1.35}
.pos i{font-style:normal;font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.06em;padding:0 7px;border-radius:4px;border:1px solid var(--line2);color:var(--mute);line-height:1.3}
.ovr{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;text-align:right;min-width:38px}
.ovr.t4{color:var(--amber)} .ovr.t3{color:var(--good)} .ovr.t2{color:var(--text)} .ovr.t1{color:var(--mute)} .ovr.tq{color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 4px;border-top:1px solid var(--line);padding-top:8px}
.stats div{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.stats b{display:block;color:var(--text);font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.02em}
.stats.hid b{color:transparent;background:repeating-linear-gradient(135deg,var(--panel3) 0 4px,var(--line) 4px 8px);border-radius:3px;height:17px;width:80%;margin-top:3px;user-select:none}
.slots{display:grid;gap:8px}
.sgrp{display:grid;grid-template-columns:42px 1fr 1fr;gap:6px;align-items:stretch}
.sgrp .lb{font-family:var(--display);font-weight:800;font-size:20px;display:flex;align-items:center;color:var(--amber);letter-spacing:.04em}
.slot{border:1px dashed var(--line2);border-radius:8px;padding:6px 8px;min-height:50px;display:flex;align-items:center;gap:7px;min-width:0}
.slot.full{border-style:solid;background:var(--panel2)}
.slot .who{min-width:0}
.slot .who b{display:block;font-family:var(--display);text-transform:uppercase;font-size:15px;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .who span{font-size:11px;color:var(--mute)}
.slot .ovr{font-size:20px;min-width:0;margin-left:auto}
.slot.empty{color:var(--dim);font-size:12px;justify-content:center}

/* ---------- coach ---------- */
.coach-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:980px){.coach-grid{grid-template-columns:1fr}}
.opt{display:grid;gap:10px}
.opt .lb{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:14px;color:var(--mute);margin-top:6px}
.desc{font-size:13px;color:var(--mute);min-height:2.6em}
input[type=range].mins{width:130px;accent-color:var(--amber)}
select,input[type=text]{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:6px 8px}

/* ---------- hub ---------- */
.rec{font-family:var(--display);font-weight:800;font-size:100px;line-height:.9}
.pips{display:flex;flex-wrap:wrap;gap:3px;margin-top:12px}
.pips i{width:12px;height:12px;border-radius:3px;background:#202a3a}
.pips i.w{background:var(--good)} .pips i.l{background:var(--bad)} .pips i.n{outline:2px solid var(--amber);outline-offset:1px}
.opp{display:grid;gap:8px;align-content:start}
.opp .t{font-family:var(--display);font-weight:700;font-size:32px;text-transform:uppercase;line-height:1}
.vs{color:var(--mute);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.res{display:inline-block;width:20px;font-weight:700;text-align:center;border-radius:3px}
.res.W{background:rgba(54,209,122,.18);color:var(--good)} .res.L{background:rgba(255,84,104,.18);color:var(--bad)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- game ---------- */
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;background:#06080b;border:2px solid var(--line2);border-radius:12px;padding:14px 22px;margin-bottom:14px;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.sb .tm{display:flex;flex-direction:column;gap:2px}
.sb .tm.r{text-align:right}
.sb .tn{font-family:var(--display);text-transform:uppercase;font-weight:700;font-size:21px;line-height:1.05}
.sb .tm.me .tn{color:var(--amber)} .sb .tm.opp .tn{color:var(--blue)}
.sb .sc{font-size:76px;line-height:1}
.sb .mid{text-align:center}
.sb .clk{font-size:42px;line-height:1}
.sb .qn{font-family:var(--display);letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.qs{font-size:12px;color:var(--mute)}
.gm{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:16px;align-items:start}
@media(max-width:1060px){.gm{grid-template-columns:1fr}}
.feed{height:430px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--ink2)}
.ev{display:grid;grid-template-columns:62px 1fr auto;gap:8px;padding:5px 10px;border-bottom:1px solid #1a2231;font-size:14px}
.ev .tm{color:var(--dim);font-size:12px;padding-top:2px;font-variant-numeric:tabular-nums}
.ev.me .tx{color:var(--amber)} .ev.op .tx{color:var(--blue)}
.ev.dim .tx{color:var(--dim)}
.ev.big{background:#1a2030;font-weight:600}
.ev .sc{font-variant-numeric:tabular-nums;color:var(--text);font-size:13px}
.ev.sys{background:#1f1b0e;color:var(--amber);font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs .chip{padding:5px 12px}
.rot{display:grid;gap:5px}
.pl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);cursor:pointer;font-size:13px}
.pl.on{border-left:4px solid var(--amber)}
.pl.pick{outline:2px solid var(--hot)}
.pl.out{opacity:.4}
.pl .a{font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase;display:flex;gap:7px;align-items:center;min-width:0}
.pl .a span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .b{color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.pl .c{grid-column:1/3;display:flex;gap:10px;align-items:center;color:var(--mute);font-variant-numeric:tabular-nums}
.pl .c .bar{flex:1}
.bar{height:6px;background:#080b10;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.bar.low i{background:var(--bad)} .bar.mid i{background:var(--amber)}
.fl{color:var(--bad);font-weight:700}
.lock{opacity:.5;pointer-events:none}
.banner{background:#2a1610;border:1px solid var(--hot);color:#ffd7c4;padding:9px 12px;border-radius:7px;margin-bottom:12px;font-weight:600}
.banner.win{background:#13261b;border-color:var(--good);color:#c9f5da}
.modal{position:fixed;inset:0;background:rgba(5,7,10,.8);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:24px;max-width:620px;width:100%;max-height:90vh;overflow:auto}
.modal h2{font-size:32px;margin-bottom:10px}
.ach{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.ach b{font-family:var(--display);text-transform:uppercase;font-size:18px;color:var(--amber);letter-spacing:.03em}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:14px;overflow-x:auto}
.ser{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.ser.me{border-color:var(--amber)}
.ser div{display:flex;justify-content:space-between;gap:8px}
.ser .w{font-weight:700;color:var(--good)}
.loading{padding:90px 0;text-align:center;color:var(--mute)}

.pcard .fit{display:flex;align-items:center;gap:7px;padding:7px 12px;border-top:1px solid var(--line2);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.pcard .fit em{margin-left:auto;font-style:normal;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;opacity:.85}
.fit.ok{background:rgba(54,209,122,.11);color:var(--good)} .fit.no{background:rgba(255,84,104,.11);color:var(--bad)} .fit.tk{background:var(--panel3);color:var(--mute)}
/* coach */
.five{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.starter{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px;display:grid;gap:8px;position:relative}
.starter .sl{position:absolute;top:-1px;left:-1px;background:var(--amber);color:#1a1200;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;padding:1px 10px;border-radius:10px 0 8px 0}
.starter .sw{display:flex;align-items:center;gap:9px;margin-top:14px}
.starter .sw b{display:block;font-family:var(--display);text-transform:uppercase;font-size:18px;line-height:1.05}
.starter .sw span{font-size:11px;color:var(--mute)}
.starter select{width:100%}
.rn{display:flex;align-items:center;gap:8px}
.rn b{display:block;font-family:var(--display);text-transform:uppercase;font-size:16px;line-height:1.05}
.rn span{font-size:11px;color:var(--mute)}
.mrow{display:flex;align-items:center;gap:10px}
.mrow .mv{font-family:var(--display);font-weight:700;font-size:20px;width:30px;text-align:right}
input[type=range].mins{-webkit-appearance:none;appearance:none;width:150px;height:6px;border-radius:3px;background:var(--panel3);accent-color:var(--amber)}
input[type=range].mins::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--amber);border:2px solid #1a1200;cursor:pointer}
input[type=range].mins::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--amber);border:2px solid #1a1200;cursor:pointer}
